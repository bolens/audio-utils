# Credential-free Linux validation; all lanes are required.
labels:
  platform: linux/amd64
  backend: docker
  # Temporary Grove diagnostic target; remove after corrected runner admission.
  hostname: ci02
clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false
when:
  - event: push
    branch: main
  - event:
      - pull_request
      - manual
      - cron
steps:
  - name: verify
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    environment:
      CI: 'true'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    commands:
      - |-
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends make python3 python3-yaml jq curl xz-utils ffmpeg flac
      - bash .devcontainer/install-shellcheck.sh
      - test "$(git rev-parse --is-shallow-repository)" = false
      - python3 scripts/ci/sync-woodpecker-validation.py --check
      - python3 -m unittest discover -s tests -p test_validation_profile.py
      - python3 -m unittest discover -s tests -p test_ci_release_downloads.py
      - make check-shared JOBS=2
      - npm ci --prefix mcp/npm --ignore-scripts --no-audit --no-fund
      - make test JOBS=2
      - make coverage
      - python3 -m unittest discover -s tests -p test_development_container.py -v
      - python3 -m unittest discover -s tests -p test_publication_policy.py -v
      - python3 -m unittest discover -s tests -p test_container_fixtures.py -v
      - python3 -m unittest discover -s tests -p test_image_bridge.py -v
      - python3 -m unittest discover -s tests -p test_native_pipeline_status.py -v
      - cd mcp/npm && npm test && npm audit --omit=dev
  - name: fleet-contracts
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    environment:
      CI: 'true'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates python3 python3-venv shellcheck
      - bash scripts/ci/check-fleet.sh
  - name: development-environment
    image: ghcr.io/bolens/audio-utils@sha256:536ba4b1712a66adbaca85ac889e6d8fd7e72deb125449434d357e5dbdbbe532
    network_mode: none
    environment:
      CI: 'true'
      JOBS: '2'
    commands:
      - |-
        /opt/audio-ci/python -I - <<'PY_OFFLINE_CHECKER'
        import fcntl
        import hashlib
        import json
        import os
        from pathlib import Path
        import platform
        import runpy
        import socket
        import struct
        import sys

        helper = "/opt/audio-ci/offline_environment.py"
        expected = "d48f4f7248e8b2a1e32f29e49bd292469bfac2dd0344e344b88cf2ef00d60b5f"
        if hashlib.sha256(Path(helper).read_bytes()).hexdigest() != expected:
            raise SystemExit("offline checker binding refused")
        workspace = os.environ["CI_WORKSPACE"]
        reported = False

        def network_facts():
            # Read-only current-namespace dumps; never emit address or endpoint bytes.
            def attributes(raw):
                result = {}
                while raw:
                    if len(raw) < 4:
                        raise ValueError("malformed diagnostic attributes")
                    size, kind = struct.unpack_from("HH", raw)
                    kind &= 0x3fff
                    if size < 4 or size > len(raw) or kind in result:
                        raise ValueError("malformed diagnostic attributes")
                    result[kind] = raw[4:size]
                    raw = raw[(size + 3) & ~3:]
                return result

            def dump(request, response, payload):
                rows = []
                total = 0
                with socket.socket(socket.AF_NETLINK, socket.SOCK_RAW, socket.NETLINK_ROUTE) as sock:
                    sock.settimeout(2)
                    sock.bind((0, 0))
                    sock.sendto(struct.pack("IHHII", 16 + len(payload), request, 0x301, 1, 0) + payload, (0, 0))
                    for _ in range(128):
                        data, _, flags, sender = sock.recvmsg(65536)
                        total += len(data)
                        if flags & socket.MSG_TRUNC or sender[0] != 0 or total > 2 * 1024 * 1024:
                            raise ValueError("incomplete diagnostic dump")
                        while data:
                            if len(data) < 16:
                                raise ValueError("malformed diagnostic message")
                            size, kind, flags, sequence, _ = struct.unpack_from("IHHII", data)
                            if size < 16 or size > len(data) or sequence != 1 or flags & 0x10:
                                raise ValueError("incomplete diagnostic dump")
                            body = data[16:size]
                            data = data[(size + 3) & ~3:]
                            if kind == 3:
                                if body and (len(body) != 4 or struct.unpack("i", body)[0] != 0):
                                    raise ValueError("failed diagnostic dump")
                                return rows
                            if kind != response or len(rows) >= 4096:
                                raise ValueError("unexpected diagnostic message")
                            rows.append(body)
                raise ValueError("incomplete diagnostic dump")

            names = {"lo", "sit0", "tunl0", "ip6tnl0", "gre0", "gretap0", "erspan0",
                     "ip6gre0", "ip6gretap0", "ip6erspan0"}
            links = []
            labels = {}
            for raw in dump(18, 16, struct.pack("BBHiII", 0, 0, 0, 0, 0, 0)):
                if len(raw) < 16:
                    raise ValueError("malformed diagnostic link")
                _, _, hardware, index, flags, _ = struct.unpack_from("BBHiII", raw)
                attrs = attributes(raw[16:])
                name = attrs.get(3, b"").rstrip(b"\0").decode("ascii", "strict")
                label = name if name in names else "unknown"
                labels[index] = label
                info = attributes(attrs[18]) if 18 in attrs else {}
                kind = info.get(1, b"").rstrip(b"\0")
                details = attributes(info[2]) if 2 in info else {}
                # Only the reviewed IPIP layout has local/remote/underlay semantics here.
                ipip = kind == b"ipip"
                links.append({"interface": label, "index": index, "hardware_type": hardware,
                              "flags": flags, "kind_ipip": ipip,
                              "local_attribute_present": ipip and 2 in details,
                              "remote_attribute_present": ipip and 3 in details,
                              "local_nonzero": ipip and any(details.get(2, b"")),
                              "remote_nonzero": ipip and any(details.get(3, b"")),
                              "underlay_nonzero": ipip and any(details.get(1, b""))})
            addresses = {}
            for raw in dump(22, 20, struct.pack("BBBBI", 0, 0, 0, 0, 0)):
                if len(raw) < 8:
                    raise ValueError("malformed diagnostic address")
                family, _, _, _, index = struct.unpack_from("BBBBI", raw)
                attributes(raw[8:])
                key = labels.get(index, "unknown") + ":" + str(family)
                addresses[key] = addresses.get(key, 0) + 1
            routes = {}
            defaults = {}
            for raw in dump(26, 24, struct.pack("BBBBBBBBI", 0, 0, 0, 0, 0, 0, 0, 0, 0)):
                if len(raw) < 12:
                    raise ValueError("malformed diagnostic route")
                family, destination_bits, _, _, _, _, _, _, _ = struct.unpack_from("BBBBBBBBI", raw)
                attrs = attributes(raw[12:])
                if 4 in attrs and len(attrs[4]) != 4:
                    raise ValueError("malformed diagnostic route interface")
                index = struct.unpack("I", attrs[4])[0] if 4 in attrs else 0
                label = labels.get(index, "none" if index == 0 else "unknown")
                key = label + ":" + str(family)
                routes[key] = routes.get(key, 0) + 1
                if destination_bits == 0:
                    defaults[key] = defaults.get(key, 0) + 1
            capabilities = {}
            for line in Path("/proc/self/status").read_text().splitlines():
                field, _, value = line.partition(":")
                if field in {"CapEff", "CapPrm", "CapInh", "CapAmb", "CapBnd"}:
                    bits = int(value.strip(), 16)
                    capabilities[field] = {"net_admin": bool(bits & (1 << 12)),
                                           "sys_admin": bool(bits & (1 << 21))}
            return {"links": links, "address_counts": addresses, "route_counts": routes,
                    "default_route_counts": defaults, "capabilities": capabilities,
                    "dump_complete": True}

        def trace(frame, event, arg):
            global reported
            if frame.f_code.co_filename != helper:
                return None
            if event == "call":
                frame.f_trace_lines = False
                frame.f_trace_opcodes = False
            if event == "exception" and isinstance(arg[1], ValueError) and not reported:
                reported = True
                sys.settrace(None)
                facts = {"function": frame.f_code.co_name, "line": frame.f_lineno}
                try:
                    interfaces = {name for _, name in socket.if_nameindex()}
                    known = ("sit0", "tunl0", "ip6tnl0", "gre0", "gretap0", "erspan0",
                             "ip6gre0", "ip6gretap0", "ip6erspan0")
                    mounts = [line.split()[4] for line in Path("/proc/self/mountinfo").read_text().splitlines()]
                    facts.update(lo_only=interfaces == {"lo"},
                                 unknown_nonlo_count=len(interfaces - {"lo", *known}),
                                 docker_marker=Path("/.dockerenv").is_file(),
                                 nix_mount_count=sum(path == "/nix" or path.startswith("/nix/") for path in mounts),
                                 platform_ok=platform.system() == "Linux" and platform.machine() == "x86_64",
                                 euid_is_root=os.geteuid() == 0,
                                 cwd_equals_workspace=Path.cwd().resolve() == Path(workspace).resolve())
                    fallback = {}
                    with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                        for name in known:
                            present = name in interfaces
                            up = False
                            if present:
                                result = fcntl.ioctl(sock, 0x8913, struct.pack("256s", name.encode()))
                                up = bool(struct.unpack_from("H", result, 16)[0] & 1)
                            fallback[name] = {"present": present, "up": up}
                    facts["fallback_interfaces"] = fallback
                    facts["network_structure"] = network_facts()
                except Exception:
                    facts["runtime_facts_unavailable"] = True
                print("offline-checker-diagnostic " + json.dumps(facts, sort_keys=True), file=sys.stderr, flush=True)
            return trace

        sys.argv = [helper, "run", "--root", workspace]
        sys.settrace(trace)
        try:
            runpy.run_path(helper, run_name="__main__")
        finally:
            sys.settrace(None)
        PY_OFFLINE_CHECKER
