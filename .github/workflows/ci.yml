name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Weekly full run: runner-image drift (ffmpeg, shellcheck, codecs) breaks
  # things without any push. Path filters are bypassed on schedule.
  schedule:
    - cron: '17 11 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Scheduled runs treat everything as changed (no diff to filter against).
    outputs:
      lib: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.lib }}
      conversion: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.conversion }}
      util: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.util }}
      tests: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.tests }}
      mcp: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.mcp }}
      docs: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.docs }}
      code: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.code }}
      conversion_tools: ${{ steps.plan.outputs.conversion_tools }}
      util_tools: ${{ steps.plan.outputs.util_tools }}
      conversion_matrix: ${{ steps.plan.outputs.conversion_matrix }}
      util_matrix: ${{ steps.plan.outputs.util_matrix }}
    steps:
      # Needed for push events; PRs can use the GitHub API without a checkout.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Path filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          list-files: json
          filters: |
            lib:
              - 'lib/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - 'scripts/**'
              - '.github/actions/**'
              - '.githooks/**'
            conversion:
              - 'conversion/**'
            util:
              - 'util/**'
            tests:
              - 'tests/**'
              - '.githooks/**'
            mcp:
              - 'mcp/**'
              - 'VERSION'
            docs:
              - '**/*.md'
              - 'scripts/check-docs.sh'
            code:
              - 'lib/**'
              - 'conversion/**'
              - 'util/**'
              - 'tests/**'
              - 'mcp/**'
              - 'VERSION'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - 'scripts/**'
              - '.github/actions/**'
              - '.githooks/**'

      - name: Plan shellcheck matrices
        id: plan
        env:
          LIB_CHANGED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.lib }}
          CONVERSION_CHANGED: ${{ steps.filter.outputs.conversion }}
          UTIL_CHANGED: ${{ steps.filter.outputs.util }}
          CONVERSION_FILES: ${{ steps.filter.outputs.conversion_files }}
          UTIL_FILES: ${{ steps.filter.outputs.util_files }}
        run: |
          set -euo pipefail

          plan_group() {
            local group="$1"
            local group_changed="$2"
            local files_json="$3"
            local -a tools=()

            # A tool dir is any dir under the group holding a Makefile
            # (conversion/<tool> or util/<category>/<tool>).
            if [[ "$LIB_CHANGED" == "true" ]]; then
              mapfile -t tools < <(
                find "$group" -mindepth 2 -name Makefile -printf '%h\n' | sort
              )
            elif [[ "$group_changed" == "true" ]]; then
              # Process substitution does not propagate jq failures to mapfile.
              jq -e 'type == "array" and all(.[]; type == "string")' <<<"$files_json" >/dev/null
              mapfile -t tools < <(
                jq -r '.[]' <<<"$files_json" | while IFS= read -r f; do
                  d=$(dirname "$f")
                  # Nearest tool owns its inputs. A removed tool or shared
                  # category input conservatively selects every surviving tool.
                  while [[ "$d" == "$group"/* ]]; do
                    if [[ -f "$d/Makefile" ]]; then
                      printf '%s\n' "$d"
                      break
                    fi
                    d=$(dirname "$d")
                  done
                  if [[ "$d" == "$group" || "$d" == . ]]; then
                    find "$group" -mindepth 2 -name Makefile -printf '%h\n'
                  fi
                done | sort -u
              )
            fi

            local count=${#tools[@]}
            local tools_json matrix_json
            if ((count == 0)); then
              tools_json='[]'
              # Always a valid include[] entry so fromJSON never sees "".
              matrix_json='[{"shard":0,"shards":1}]'
            else
              tools_json="$(printf '%s\n' "${tools[@]}" | jq -R . | jq -s -c .)"
              local shards=1
              if ((count > 8)); then
                shards=4
              elif ((count > 3)); then
                shards=2
              fi
              matrix_json="$(jq -c -n --argjson n "$shards" \
                '[range($n) | {shard: ., shards: $n}]')"
            fi

            # Single-line outputs (avoid heredoc/newline surprises with fromJSON).
            printf '%s_tools=%s\n' "$group" "$tools_json" >>"$GITHUB_OUTPUT"
            printf '%s_matrix=%s\n' "$group" "$matrix_json" >>"$GITHUB_OUTPUT"

            echo "${group}: ${count} tool(s), matrix=${matrix_json}"
          }

          plan_group conversion "$CONVERSION_CHANGED" "$CONVERSION_FILES"
          plan_group util "$UTIL_CHANGED" "$UTIL_FILES"

  shellcheck-lib:
    name: shellcheck (lib)
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        uses: ./.github/actions/install-shellcheck # zizmor: ignore[self-repository] actionlint 1.7.12 requires the current local-action syntax.

      - name: shellcheck lib
        run: make check-lib

  shellcheck-conversion:
    name: shellcheck (conversion ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: >-
      needs.changes.outputs.conversion == 'true' ||
      needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.conversion_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        uses: ./.github/actions/install-shellcheck # zizmor: ignore[self-repository] actionlint 1.7.12 requires the current local-action syntax.

      - name: shellcheck conversion tools
        env:
          TOOLS_JSON: ${{ needs.changes.outputs.conversion_tools }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          jq -r --argjson s "$SHARD" --argjson n "$SHARDS" \
            'to_entries[] | select((.key % $n) == $s) | .value' \
            <<<"$TOOLS_JSON" >.ci-tools.txt
          if [[ ! -s .ci-tools.txt ]]; then
            echo "No tools for this shard"
            exit 0
          fi
          echo "Shard $SHARD/$SHARDS:"
          cat .ci-tools.txt
          xargs -a .ci-tools.txt -P"$(nproc)" -I{} make -C {} check

  shellcheck-util:
    name: shellcheck (util ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: >-
      needs.changes.outputs.util == 'true' ||
      needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.util_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        uses: ./.github/actions/install-shellcheck # zizmor: ignore[self-repository] actionlint 1.7.12 requires the current local-action syntax.

      - name: shellcheck util tools
        env:
          TOOLS_JSON: ${{ needs.changes.outputs.util_tools }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          jq -r --argjson s "$SHARD" --argjson n "$SHARDS" \
            'to_entries[] | select((.key % $n) == $s) | .value' \
            <<<"$TOOLS_JSON" >.ci-tools.txt
          if [[ ! -s .ci-tools.txt ]]; then
            echo "No tools for this shard"
            exit 0
          fi
          echo "Shard $SHARD/$SHARDS:"
          cat .ci-tools.txt
          xargs -a .ci-tools.txt -P"$(nproc)" -I{} make -C {} check

  # Preserve full Fedora make-check coverage across shared checks and tool shards.
  shellcheck-fedora:
    name: shellcheck (Fedora ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [shared, 0, 1, 2, 3, 4, 5, 6, 7]
    container: fedora:latest@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: dnf install -y ShellCheck make findutils diffutils jq

      - name: Check shared library, scripts, and documentation
        if: matrix.shard == 'shared'
        run: make check-shared

      - name: Check tool shard
        if: matrix.shard != 'shared'
        shell: bash
        env:
          CONVERSION_TOOLS: ${{ needs.changes.outputs.conversion_tools }}
          UTIL_TOOLS: ${{ needs.changes.outputs.util_tools }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          jq -nr --argjson conversion "$CONVERSION_TOOLS" --argjson util "$UTIL_TOOLS" \
            --argjson shard "$SHARD" \
            '($conversion + $util) | to_entries[] | select(.key % 8 == $shard) | .value' \
            >.ci-tools.txt
          if [[ ! -s .ci-tools.txt ]]; then
            echo "No tools for this shard"
            exit 0
          fi
          cat .ci-tools.txt
          xargs -a .ci-tools.txt -P"$(nproc)" -I{} make -C {} check

  # Unit + smoke tests: cheap, run on any code change.
  test-unit-smoke:
    name: tests (unit + smoke)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg flac

      - name: Install shellcheck
        uses: ./.github/actions/install-shellcheck # zizmor: ignore[self-repository] actionlint 1.7.12 requires the current local-action syntax.

      - name: shellcheck test suite
        run: make check-tests

      - name: Run unit + smoke tests
        run: make test

      # Fails when a tool lacks functional coverage (and is not exempted in
      # tests/coverage-exempt.tsv) or when exempt entries go stale.
      - name: Coverage audit
        run: make coverage

  test-mcp-node:
    name: tests (MCP Node gateway)
    needs: changes
    if: needs.changes.outputs.mcp == 'true' || needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp/npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use minimum supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/npm/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check and test gateway
        run: npm test

  check-docs:
    name: docs (local links)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check local Markdown links
        run: make check-docs

  # Build optional source codecs once, then restore them into every functional shard.
  prepare-codecs:
    name: prepare optional codecs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ape-key: ${{ steps.keys.outputs.ape }}
      keyfinder-key: ${{ steps.keys.outputs.keyfinder }}
      ape-ready: ${{ steps.ape-cache.outputs.cache-hit == 'true' || steps.ape-build.outcome == 'success' }}
      keyfinder-ready: ${{ steps.keyfinder-cache.outputs.cache-hit == 'true' || steps.keyfinder-build.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Identify pinned codec builds
        id: keys
        env:
          PLATFORM: ${{ runner.os }}-${{ runner.arch }}
          APE_RECIPE: ${{ hashFiles('scripts/ape-codec.sh') }}
          KEYFINDER_RECIPE: ${{ hashFiles('scripts/keyfinder-cli.sh') }}
        run: |
          printf 'ape=ape-v1-%s-%s-%s\n' "$PLATFORM" "${ImageVersion:?}" "$APE_RECIPE" >> "$GITHUB_OUTPUT"
          printf 'keyfinder=keyfinder-v1-%s-%s-%s\n' "$PLATFORM" "${ImageVersion:?}" "$KEYFINDER_RECIPE" >> "$GITHUB_OUTPUT"
      - name: Restore pinned APE build
        id: ape-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci-cache/ape
          key: ${{ steps.keys.outputs.ape }}
      - name: Restore pinned keyfinder build
        id: keyfinder-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci-cache/keyfinder
          key: ${{ steps.keys.outputs.keyfinder }}
      - name: Install build dependencies on cache miss
        if: steps.ape-cache.outputs.cache-hit != 'true' || steps.keyfinder-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ unzip pkg-config git curl \
            libfftw3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
      - name: Build APE once (best effort)
        id: ape-build
        if: steps.ape-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.ci-cache/ape/share
          XDG_CACHE_HOME: ${{ runner.temp }}/ape-downloads
        run: bash scripts/ape-codec.sh install --prefix "$GITHUB_WORKSPACE/.ci-cache/ape"
      - name: Cache only a completed APE installation
        if: steps.ape-build.outcome == 'success' && steps.ape-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci-cache/ape
          key: ${{ steps.keys.outputs.ape }}
      - name: Build keyfinder once (best effort)
        id: keyfinder-build
        if: steps.keyfinder-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash scripts/keyfinder-cli.sh install --prefix "$GITHUB_WORKSPACE/.ci-cache/keyfinder"
      - name: Cache only a completed keyfinder installation
        if: steps.keyfinder-build.outcome == 'success' && steps.keyfinder-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci-cache/keyfinder
          key: ${{ steps.keys.outputs.keyfinder }}

  # Functional tests: heavier fixtures/codecs, sharded across runners and
  # run against both ffmpeg ends we support: the distro's (oldest we care
  # about) and the current upstream release (matches dev machines). Version
  # skew here has produced real bugs (ffmpeg 6.1 truncating decodes when
  # fd 0 was closed) that only one end of the range could catch.
  # Encoders missing from the runner's ffmpeg exercise the SKIP path.
  test-functional:
    name: tests (functional ${{ matrix.shard }}/2, ffmpeg ${{ matrix.ffmpeg }})
    needs: [changes, prepare-codecs]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        ffmpeg: [apt, latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg flac bpm-tools musepack-tools libchromaprint-tools \
            cmake g++ unzip zip rsgain pkg-config git sox libsox-fmt-all \
            libfftw3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev

      # BtbN static build of the latest upstream release; shadows apt's
      # ffmpeg/ffprobe via /usr/local/bin PATH precedence.
      - name: Install latest ffmpeg (static build)
        if: matrix.ffmpeg == 'latest'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          sudo install -m 0755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/{ffmpeg,ffprobe} /usr/local/bin/
          ffmpeg -version | head -1

      - name: Restore shared APE installation
        if: needs.prepare-codecs.outputs.ape-ready == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci-cache/ape
          key: ${{ needs.prepare-codecs.outputs.ape-key }}
          fail-on-cache-miss: true

      - name: Restore shared keyfinder installation
        if: needs.prepare-codecs.outputs.keyfinder-ready == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci-cache/keyfinder
          key: ${{ needs.prepare-codecs.outputs.keyfinder-key }}
          fail-on-cache-miss: true

      - name: Expose shared optional tools
        run: |
          echo "$GITHUB_WORKSPACE/.ci-cache/ape/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.ci-cache/keyfinder/bin" >> "$GITHUB_PATH"
          printf 'LD_LIBRARY_PATH=%s\n' "$GITHUB_WORKSPACE/.ci-cache/keyfinder/lib:$GITHUB_WORKSPACE/.ci-cache/keyfinder/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Warn if optional codecs missing
        run: |
          set -euo pipefail
          missing=()
          command -v mac >/dev/null 2>&1 || missing+=(mac)
          command -v keyfinder-cli >/dev/null 2>&1 || missing+=(keyfinder-cli)
          if ((${#missing[@]} > 0)); then
            echo "::warning::optional tools not on PATH (${missing[*]}); related tests will SKIP toward MAX_SKIPS"
          else
            echo "optional tools present: mac keyfinder-cli"
          fi

      # Fixtures are deterministic per (generator script, ffmpeg build).
      - name: Fixture cache key
        id: ffver
        run: echo "ffmpeg=$(ffmpeg -version | head -1 | awk '{print $3}')" >>"$GITHUB_OUTPUT"

      - name: Cache test fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tests/.cache
          key: fixtures-${{ hashFiles('tests/fixtures.sh') }}-ffmpeg-${{ steps.ffver.outputs.ffmpeg }}

      - name: Run functional shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 2
        run: |
          set -euo pipefail
          mapfile -t files < <(bash tests/run.sh --list functional)
          declare -a mine=()
          for i in "${!files[@]}"; do
            if (( i % SHARDS == SHARD )); then
              mine+=("${files[$i]}")
            fi
          done
          if ((${#mine[@]} == 0)); then
            echo "No files for this shard"
            exit 0
          fi
          printf 'Shard %s/%s:\n' "$SHARD" "$SHARDS"
          printf '  %s\n' "${mine[@]}"
          bash tests/run.sh "${mine[@]}" 2>&1 | tee test-output.log

      # Skips are how coverage erodes silently (a dependency vanishes from
      # the image and its tests stop running). Surface them on the run page,
      # fail on unexpected skip reasons, and fail if the count grows past baseline.
      - name: Skip report
        if: always()
        env:
          MAX_SKIPS: 10
        run: |
          set -euo pipefail
          [[ -f test-output.log ]] || exit 0
          skips=$(grep -c '# SKIP' test-output.log || true)
          {
            echo "### Skipped tests: ${skips} (shard ${{ matrix.shard }}, ffmpeg ${{ matrix.ffmpeg }})"
            grep '# SKIP' test-output.log | sed 's/^ *//; s/^/- /' || true
          } >>"$GITHUB_STEP_SUMMARY"

          unexpected=0
          while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            case "$line" in
              *'missing dependency:'*|\
              *'ffmpeg lacks'*|\
              *'no fpcalc'*|\
              *'no python3'*|\
              *'no mac binary'*|\
              *'no mpcenc'*|\
              *'no bpm'*|\
              *'no rsgain'*|\
              *'no C++ compiler'*|\
              *'running as root'*|\
              *'fixture build failed'*|\
              *'sox lacks dff'*)
                ;;
              *)
                echo "::error::Unexpected skip (not in allowlist): $line"
                unexpected=1
                ;;
            esac
          done < <(grep '# SKIP' test-output.log || true)
          if ((unexpected)); then
            exit 1
          fi
          if ((skips > MAX_SKIPS)); then
            echo "::error::$skips skipped tests exceeds MAX_SKIPS=$MAX_SKIPS — missing dependency on the runner?"
            exit 1
          fi

  # Single required status for branch protection when path filters skip jobs.
  ci:
    name: CI
    timeout-minutes: 5
    needs:
      - changes
      - shellcheck-lib
      - shellcheck-conversion
      - shellcheck-util
      - shellcheck-fedora
      - test-unit-smoke
      - test-mcp-node
      - check-docs
      - prepare-codecs
      - test-functional
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["NEEDS_JSON"])
          flags = jobs["changes"].get("outputs", {})
          contracts = {
              "shellcheck-lib": ("lib",),
              "shellcheck-conversion": ("lib", "conversion"),
              "shellcheck-util": ("lib", "util"),
              "shellcheck-fedora": ("lib",),
              "test-unit-smoke": ("code",),
              "test-mcp-node": ("mcp", "lib"),
              "check-docs": ("docs",),
              "prepare-codecs": ("code",),
              "test-functional": ("code",),
          }
          invalid = jobs["changes"]["result"] != "success"
          invalid |= any(flags.get(key) not in ("true", "false")
                         for keys in contracts.values() for key in keys)
          for job, keys in contracts.items():
              expected = "success" if any(flags.get(key) == "true" for key in keys) else "skipped"
              if jobs[job]["result"] != expected:
                  print(f"{job}: expected {expected}, got {jobs[job]['result']}")
                  invalid = True
          sys.exit(1 if invalid else 0)
          PYTHON
