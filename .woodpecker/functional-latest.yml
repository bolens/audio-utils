# Credential-free Linux validation; all lanes are required.
labels:
  platform: linux/amd64
  backend: docker
when:
  - event: push
    branch: main
  - event:
      - pull_request
      - manual
      - cron
steps:
  - name: functional-latest
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    commands:
      - apt-get update && apt-get install -y --no-install-recommends ffmpeg flac bpm-tools musepack-tools libchromaprint-tools
        cmake g++ unzip zip rsgain pkg-config git sox libsox-fmt-all libfftw3-dev libavcodec-dev libavformat-dev libavutil-dev
        libswresample-dev util-linux python3 curl ca-certificates xz-utils
      - python3 scripts/ci/install-rolling-ffmpeg.py
      - bash scripts/ci/check-functional.sh
