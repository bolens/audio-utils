# Credential-free Linux validation; all lanes are required.
labels:
  platform: linux/amd64
  backend: docker
clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false
when:
  - event: push
    branch: main
  - event:
      - pull_request
      - manual
      - cron
steps:
  - name: verify
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    environment:
      CI: 'true'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    commands:
      - |-
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends make python3 python3-yaml jq curl xz-utils ffmpeg flac
      - bash .devcontainer/install-shellcheck.sh
      - test "$(git rev-parse --is-shallow-repository)" = false
      - python3 scripts/ci/sync-woodpecker-validation.py --check
      - python3 -m unittest discover -s tests -p test_validation_profile.py
      - python3 -m unittest discover -s tests -p test_ci_release_downloads.py
      - make check-shared JOBS=2
      - npm ci --prefix mcp/npm --ignore-scripts --no-audit --no-fund
      - make test JOBS=2
      - make coverage
      - python3 -m unittest discover -s tests -p test_development_container.py -v
      - python3 -m unittest discover -s tests -p test_publication_policy.py -v
      - python3 -m unittest discover -s tests -p test_container_fixtures.py -v
      - python3 -m unittest discover -s tests -p test_image_bridge.py -v
      - python3 -m unittest discover -s tests -p test_native_pipeline_status.py -v
      - cd mcp/npm && npm test && npm audit --omit=dev
  - name: fleet-contracts
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    environment:
      CI: 'true'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates python3 python3-venv shellcheck
      - bash scripts/ci/check-fleet.sh
  - name: development-environment
    image: ghcr.io/bolens/audio-utils@sha256:536ba4b1712a66adbaca85ac889e6d8fd7e72deb125449434d357e5dbdbbe532
    network_mode: none
    environment:
      CI: 'true'
      JOBS: '2'
    commands:
      - /opt/audio-ci/python /opt/audio-ci/offline_environment.py run --root "$CI_WORKSPACE"
