# Credential-free Linux validation; all lanes are required.
labels:
  platform: linux/amd64
  backend: docker
when:
  - event: push
    branch: main
  - event:
      - pull_request
      - manual
steps:
  - name: tool-shellcheck
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    commands:
      - apt-get update && apt-get install -y --no-install-recommends make curl ca-certificates xz-utils
      - bash .devcontainer/install-shellcheck.sh
      - make check-tools JOBS=2
